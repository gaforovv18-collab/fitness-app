<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#16a34a"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>Мой фитнес-помощник</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#66707c;--ac:#16a34a;--ac2:#e8f7ee;--bd:#e3e6ea;--wa:#0ea5e9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101316;--card:#1a1f24;--tx:#eceff2;--mu:#98a2ad;--ac:#34d399;--ac2:#14352a;--bd:#2a3138;--wa:#38bdf8}}
:root[data-theme="dark"]{--bg:#101316;--card:#1a1f24;--tx:#eceff2;--mu:#98a2ad;--ac:#34d399;--ac2:#14352a;--bd:#2a3138;--wa:#38bdf8}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:14px 14px 90px}
h1{font-size:20px;margin:6px 0 12px}h2{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);padding:9px 2px;font-size:11px;cursor:pointer}
nav button b{display:block;font-size:20px;font-weight:400}nav button.on{color:var(--ac);font-weight:600}
.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:13px;color:var(--mu);display:block}
input,select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--tx);font-size:16px}
.big{font-size:28px;font-weight:700;color:var(--ac)}.mu{color:var(--mu);font-size:13px}
.btn{background:var(--ac);color:#04200f;border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;font-size:15px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding-bottom:4px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:6px 12px;white-space:nowrap;cursor:pointer;font-size:14px}
.chip.on{background:var(--ac);color:#04200f;border-color:var(--ac)}
.ex{display:flex;gap:12px;align-items:center}.ex svg{flex:0 0 46%;width:46%;max-width:240px;aspect-ratio:10/7;height:auto;background:var(--ac2);border-radius:10px}.ex>div{flex:1;min-width:0;overflow-wrap:break-word}
.tag{display:inline-block;background:var(--ac2);color:var(--ac);border-radius:6px;padding:1px 7px;font-size:12px;margin-right:4px}
ul{margin:4px 0;padding-left:20px}li{margin:2px 0}
.bar{height:14px;background:var(--bd);border-radius:8px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--wa);width:0;transition:width .3s}
#toast{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:12px;right:12px;max-width:600px;margin:auto;background:var(--ac);color:#04200f;padding:12px 14px;border-radius:12px;font-weight:600;display:none;z-index:9}
.sec{display:none}.sec.on{display:block}
.row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
</style></head><body>
<div id="toast"></div>
<main>
<h1>💪 Мой фитнес-помощник</h1>

<section class="sec on" id="s-set">
 <div class="card"><h2>Мои параметры</h2>
  <div class="g">
   <div><label>Рост, см</label><input id="h" type="number" inputmode="numeric"></div>
   <div><label>Вес, кг</label><input id="w" type="number" inputmode="decimal"></div>
   <div><label>Возраст</label><input id="age" type="number" inputmode="numeric"></div>
   <div><label>Пол</label><select id="sex"><option value="m">Мужской</option><option value="f">Женский</option></select></div>
   <div><label>Цель</label><select id="goal"><option value="cut">Сжечь жир</option><option value="gain">Набрать мышцы</option></select></div>
   <div><label>Сон, часов</label><input id="sl" type="number" step="0.5" inputmode="decimal"></div>
   <div><label>Подъём в</label><input id="wake" type="time"></div>
   <div><label>Время тренировки</label><input id="tr" type="time"></div>
   <div><label>Длительность, мин</label><input id="dur" type="number" inputmode="numeric"></div>
   <div><label>Напоминать про воду</label><select id="wr"><option value="1">Да, каждые 2 часа</option><option value="0">Нет</option></select></div>
  </div>
  <p><button class="btn" id="save">Сохранить и включить уведомления</button></p>
  <p class="mu" id="perm"></p>
 </div>
 <div class="card"><h2>Мои показатели</h2><div id="stats"></div></div>
</section>

<section class="sec" id="s-sleep">
 <div class="card"><h2>😴 Сон</h2><div id="sleepBox"></div></div>
 <div class="card"><h2>Ближайшие напоминания</h2><div id="sched"></div></div>
</section>

<section class="sec" id="s-train">
 <div class="chips" id="chips"></div>
 <div id="exs"></div>
</section>

<section class="sec" id="s-food">
 <div class="card"><h2 id="foodT"></h2><div id="foodBox"></div></div>
</section>

<section class="sec" id="s-water">
 <div class="card"><h2>💧 Вода сегодня</h2>
  <div class="big" id="wNeed"></div><div class="mu" id="wSub"></div>
  <div class="bar"><i id="wBar"></i></div>
  <div id="wDone" style="margin-bottom:8px"></div>
  <button class="btn" id="add">+ стакан (250 мл)</button>
  <button class="chip" id="undo">отменить</button>
 </div>
 <div class="card mu">Норма: примерно 33 мл на 1 кг веса плюс 0,6 л на каждый час тренировки. В жару пейте чуть больше.</div>
</section>
</main>

<nav id="nav">
 <button data-t="set" class="on"><b>⚙️</b>Параметры</button>
 <button data-t="sleep"><b>😴</b>Сон</button>
 <button data-t="train"><b>🏋️</b>Тренировки</button>
 <button data-t="food"><b>🥗</b>Питание</button>
 <button data-t="water"><b>💧</b>Вода</button>
</nav>

<script>
var $=function(i){return document.getElementById(i)};
var DEF={h:175,w:75,age:25,sex:'m',goal:'cut',sl:8,wake:'07:00',tr:'18:00',dur:45,wr:'1'};
var S=Object.assign({},DEF);
try{var r=localStorage.getItem('fit_s');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
var ids=['h','w','age','sex','goal','sl','wake','tr','dur','wr'];
function fill(){ids.forEach(function(k){$(k).value=S[k]})}
function pad(n){return (n<10?'0':'')+n}
function toMin(t){var p=t.split(':');return +p[0]*60+ +p[1]}
function fromMin(m){m=((m%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60)}
function fmt(x){return String(Math.round(x*10)/10).replace('.',',')}

/* расчёты */
function calc(){
 var w=+S.w,h=+S.h,a=+S.age,m=S.sex==='m';
 var bmi=w/Math.pow(h/100,2);
 var bmr=10*w+6.25*h-5*a+(m?5:-161);
 var tdee=bmr*1.5;
 var kc=S.goal==='cut'?tdee-450:tdee+300;
 var pr=w*(S.goal==='cut'?2:1.8);
 var water=w*0.033+(+S.dur/60)*0.6;
 return{bmi:bmi,kc:kc,pr:pr,water:water,fat:w*0.9}
}
function bmiTxt(b){return b<18.5?'ниже нормы':b<25?'норма':b<30?'выше нормы':'ожирение'}
function renderStats(){
 var c=calc();
 $('stats').innerHTML=
 '<div class="row"><span>Индекс массы тела</span><b>'+fmt(c.bmi)+' ('+bmiTxt(c.bmi)+')</b></div>'+
 '<div class="row"><span>Калории в день</span><b>≈ '+Math.round(c.kc/10)*10+' ккал</b></div>'+
 '<div class="row"><span>Белок в день</span><b>≈ '+Math.round(c.pr)+' г</b></div>'+
 '<div class="row"><span>Вода в день</span><b>≈ '+fmt(c.water)+' л</b></div>'+
 '<div class="row"><span>Сон</span><b>'+fmt(+S.sl)+' ч</b></div>'+
 '<p class="mu">Это ориентиры, а не медицинские назначения. При болезнях проконсультируйтесь с врачом.</p>';
}

/* сон */
function renderSleep(){
 var wake=toMin(S.wake),bed=wake-Math.round(+S.sl*60);
 var cyc=Math.round(+S.sl*60/90*10)/10;
 $('sleepBox').innerHTML=
 '<div class="big">Ложитесь в '+fromMin(bed)+'</div>'+
 '<div class="mu">Подъём в '+S.wake+' · сон '+fmt(+S.sl)+' ч (≈ '+fmt(cyc)+' циклов по 90 мин)</div>'+
 '<ul><li>Взрослым нужно 7–9 часов, при активных тренировках лучше 8–9: мышцы растут и жир уходит именно во сне.</li>'+
 '<li>Напоминание придёт за 30 минут до сна: уберите телефон, приглушите свет.</li>'+
 '<li>Последний приём пищи за 2–3 часа до сна, кофеин — до 15:00.</li>'+
 '<li>Ложитесь и вставайте в одно время, даже в выходные.</li></ul>';
 var ev=events().sort(function(a,b){return a.m-b.m});
 var now=new Date(),nm=now.getHours()*60+now.getMinutes();
 $('sched').innerHTML=ev.map(function(e){return '<div class="row"><span>'+e.ic+' '+e.t+'</span><b>'+fromMin(e.m)+'</b></div>'}).join('')+
 '<p class="mu">Уведомления приходят, пока приложение открыто во вкладке или в фоне браузера. Для надёжности добавьте страницу на главный экран.</p>';
}
function events(){
 var wake=toMin(S.wake),bed=wake-Math.round(+S.sl*60),tr=toMin(S.tr),L=[];
 L.push({id:'b30',m:(bed-30+1440)%1440,ic:'🌙',t:'Скоро спать',b:'Через 30 минут пора ложиться: уберите телефон.'});
 L.push({id:'bed',m:(bed+1440)%1440,ic:'😴',t:'Пора спать',b:'Ложитесь. Нужно поспать '+fmt(+S.sl)+' ч, подъём в '+S.wake+'.'});
 L.push({id:'wk',m:wake,ic:'☀️',t:'Доброе утро',b:'Выпейте стакан воды и сделайте зарядку.'});
 L.push({id:'tr15',m:(tr-15+1440)%1440,ic:'🏋️',t:'Скоро тренировка',b:'Через 15 минут тренировка: переоденьтесь, выпейте воды.'});
 L.push({id:'tr',m:tr,ic:'🔥',t:'Время тренировки',b:'Начинаем! Откройте раздел «Тренировки».'});
 if(S.wr==='1'){for(var m=wake+120,i=1;m<bed-120+(bed<wake?1440:0)&&i<8;m+=120,i++)L.push({id:'w'+i,m:m%1440,ic:'💧',t:'Выпейте воды',b:'Выпейте стакан воды. Норма сегодня ≈ '+fmt(calc().water)+' л.'})}
 return L;
}
var fired={};try{fired=JSON.parse(localStorage.getItem('fit_f')||'{}')}catch(e){}
function check(){
 var n=new Date(),k=n.getHours()*60+n.getMinutes(),d=n.toDateString();
 events().forEach(function(e){
  var key=d+e.id;
  if(e.m===k&&!fired[key]){fired={};fired[key]=1;try{localStorage.setItem('fit_f',JSON.stringify(fired))}catch(x){}notify(e.ic+' '+e.t,e.b)}
 });
}
function beep(){try{var c=new (window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.value=.15;o.start();setTimeout(function(){o.stop();c.close()},400)}catch(e){}}
function notify(t,b){
 var el=$('toast');el.textContent=t+' — '+b;el.style.display='block';setTimeout(function(){el.style.display='none'},9000);
 try{if(window.Notification&&Notification.permission==='granted')new Notification(t,{body:b})}catch(e){}
 try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
 beep();
}
function permTxt(){var p='';try{p=window.Notification?Notification.permission:'none'}catch(e){p='none'}
 $('perm').textContent=p==='granted'?'Системные уведомления включены.':p==='denied'?'Уведомления заблокированы в браузере: напоминания будут показываться внутри приложения со звуком.':'Нажмите «Сохранить», чтобы разрешить уведомления.'}

/* тренировки */
/* поза: h — таз, t — наклон корпуса (0 вверх, 90 вперёд, 180 вниз), hd — голова, A/L — руки/ноги [ближняя, дальняя]:
   углы сегментов [плечо, предплечье] или опора {p:[x,y],b:±1} (сгиб считается сам), f — стопа относительно голени, fa — стопа абсолютно, fv — анфас */
var LEN={t:17,ua:10.5,fa:10,th:14.5,sh:14,ft:4.2},GY=62;
function D(a){a*=Math.PI/180;return[Math.sin(a),-Math.cos(a)]}
function add(p,a,l){var d=D(a);return[p[0]+d[0]*l,p[1]+d[1]*l]}
function ang(p,q){return Math.atan2(q[0]-p[0],p[1]-q[1])*180/Math.PI}
function ik(s,o,l1,l2){
 var d=Math.hypot(o.p[0]-s[0],o.p[1]-s[1]);d=Math.min(Math.max(d,Math.abs(l1-l2)+.01),l1+l2-.01);
 var a1=ang(s,o.p)+o.b*Math.acos((l1*l1+d*d-l2*l2)/(2*l1*d))*180/Math.PI;
 return[a1,ang(add(s,a1,l1),o.p)]
}
function roots(h,t,fv,i){var s=add(h,t,LEN.t),sd=t+(i?-90:90);return fv?[add(s,sd,4.6),add(h,sd,2.8)]:[s,h]}
function canon(P){
 var c={h:P.h,t:P.t,hd:P.hd||0,fv:P.fv,A:[],L:[],F:[]};
 for(var i=0;i<2;i++){
  var r=roots(P.h,P.t,P.fv,i),a=P.A[i],l=P.L[i];
  c.A[i]=a.p?ik(r[0],a,LEN.ua,LEN.fa):a;
  c.L[i]=l.p?ik(r[1],l,LEN.th,LEN.sh):l;
  c.F[i]=P.fv?(i?240:120):P.fa?P.fa[i]:c.L[i][1]+(P.f?P.f[i]:-90);
 }
 return c
}
function mix(a,b,u){
 function m(x,y){return x+(y-x)*u}
 function ma(x,y){return x+(((y-x)%360+540)%360-180)*u}
 function pr(p,q){return[ma(p[0],q[0]),ma(p[1],q[1])]}
 return{h:[m(a.h[0],b.h[0]),m(a.h[1],b.h[1])],t:ma(a.t,b.t),hd:ma(a.hd,b.hd),fv:a.fv,
  A:[pr(a.A[0],b.A[0]),pr(a.A[1],b.A[1])],L:[pr(a.L[0],b.L[0]),pr(a.L[1],b.L[1])],F:[ma(a.F[0],b.F[0]),ma(a.F[1],b.F[1])]}
}
function joints(c){
 var J={h:c.h,s:add(c.h,c.t,LEN.t),A:[],L:[]};J.hc=add(J.s,c.t+c.hd,6.9);
 for(var i=0;i<2;i++){
  var r=roots(c.h,c.t,c.fv,i),e=add(r[0],c.A[i][0],LEN.ua),k=add(r[1],c.L[i][0],LEN.th),an=add(k,c.L[i][1],LEN.sh);
  J.A[i]={s:r[0],e:e,w:add(e,c.A[i][1],LEN.fa)};
  J.L[i]={h:r[1],k:k,a:an,t:add(an,c.F[i],LEN.ft)};
 }
 return J
}
/* объёмная отрисовка: каждый сегмент — капсула с бликом и тенью */
var NEAR={sk:'#f2c79b',sh:'#2563eb',pn:'#1f2937',bt:'#ef4444'},FAR={sk:'#d29d72',sh:'#1e3a8a',pn:'#0b1220',bt:'#a51d1d'};
function n2(v){return v.toFixed(2)}
function lerp(p,q,u){return[p[0]+(q[0]-p[0])*u,p[1]+(q[1]-p[1])*u]}
function cap(p,r1,q,r2,col){
 var dx=q[0]-p[0],dy=q[1]-p[1],l=Math.hypot(dx,dy)||.01,nx=-dy/l,ny=dx/l,lt=nx*-.6+ny*-.8>0?1:-1;
 function pt(o,r,s){return n2(o[0]+nx*r*s)+' '+n2(o[1]+ny*r*s)}
 function ln(s,c,op,w){return '<path d="M'+pt(p,r1*.5,s)+'L'+pt(q,r2*.5,s)+'" stroke="'+c+'" stroke-opacity="'+op+'" stroke-width="'+n2(Math.min(r1,r2)*w)+'" stroke-linecap="round"/>'}
 return '<path d="M'+pt(p,r1,1)+'L'+pt(q,r2,1)+'A'+r2+' '+r2+' 0 0 0 '+pt(q,r2,-1)+'L'+pt(p,r1,-1)+'A'+r1+' '+r1+' 0 0 0 '+pt(p,r1,1)+'Z" fill="'+col+'" stroke="#000" stroke-opacity=".3" stroke-width=".35"/>'+
  ln(-lt,'#000',.16,.6)+ln(lt,'#fff',.32,.5)
}
function ball(p,r,col){return '<circle cx="'+n2(p[0])+'" cy="'+n2(p[1])+'" r="'+r+'" fill="'+col+'" stroke="#000" stroke-opacity=".3" stroke-width=".35"/>'}
function leg(g,c){return cap(g.h,3,g.k,2.3,c.sk)+cap(g.h,3.4,lerp(g.h,g.k,.55),2.95,c.pn)+cap(g.k,2.3,g.a,1.6,c.sk)+cap(g.a,1.7,g.t,1.2,c.bt)}
function arm(g,c,prop){
 var o=cap(g.s,2.05,g.e,1.7,c.sk)+cap(g.s,2.45,lerp(g.s,g.e,.45),2.2,c.sh)+cap(g.e,1.7,g.w,1.3,c.sk)+ball(g.w,1.6,c.sk);
 if(prop==='bottle'){var a=ang(g.e,g.w)+90;o+=cap(add(g.w,a,-3),1.25,add(g.w,a,3),1.25,'#38bdf8')+ball(g.w,1.6,c.sk)}
 return o
}
function pack(w){return '<rect x="'+n2(w[0]-3.4)+'" y="'+n2(w[1]+.6)+'" width="6.8" height="7.5" rx="1.8" fill="#b45309" stroke="#000" stroke-opacity=".3" stroke-width=".35"/><rect x="'+n2(w[0]-3.4)+'" y="'+n2(w[1]+.6)+'" width="6.8" height="2.8" rx="1.4" fill="#92400e"/>'}
var CHAIR='<g fill="#a8a29e" stroke="#000" stroke-opacity=".3" stroke-width=".35"><rect x="12" y="20" width="2.6" height="42" rx="1"/><rect x="31.5" y="43" width="2.6" height="19" rx="1"/><rect x="11" y="41.4" width="24" height="2.8" rx="1.2" fill="#d6d3d1"/></g>';
function head(J,c){
 var up=c.t+c.hd,hc=J.hc,f=D(up+90),u=D(up),o='';
 function P(a,b){return[hc[0]+f[0]*a+u[0]*b,hc[1]+f[1]*a+u[1]*b]}
 if(c.fv){
  o=ball(P(0,.5),4.5,'#4a2f1b')+ball(P(0,-.4),4.05,NEAR.sk)+ball(P(1.5,.1),.55,'#1f2937')+ball(P(-1.5,.1),.55,'#1f2937');
 }else{
  o=ball(P(3.7,-.2),1,NEAR.sk)+ball(hc,4.5,'#4a2f1b')+ball(P(.85,-.55),4.05,NEAR.sk)+ball(P(2.6,.5),.55,'#1f2937')+ball(P(-.6,-.4),1,FAR.sk);
 }
 return o+'<circle cx="'+n2(hc[0]-1.4)+'" cy="'+n2(hc[1]-1.7)+'" r="1.4" fill="#fff" fill-opacity=".28"/>'
}
function fig(c,prop){
 var J=joints(c),xs=[J.h[0],J.s[0],J.hc[0]];
 J.A.concat(J.L).forEach(function(g){for(var k in g)xs.push(g[k][0])});
 var x0=Math.min.apply(0,xs),x1=Math.max.apply(0,xs),
  o='<rect x="0" y="'+GY+'" width="100" height="8" fill="#000" fill-opacity=".08"/><ellipse cx="'+n2((x0+x1)/2)+'" cy="'+(GY+.4)+'" rx="'+n2((x1-x0)/2+3)+'" ry="1.5" fill="#000" fill-opacity=".2"/>';
 if(prop==='chair')o+=CHAIR;
 var neck=cap(J.s,1.8,add(J.s,c.t+c.hd,3.3),1.7,NEAR.sk),
  torso=cap(J.h,c.fv?5.2:4.5,J.s,c.fv?6.2:4.9,NEAR.sh)+cap(add(J.h,c.t,-1),c.fv?5.6:4.8,add(J.h,c.t,4),c.fv?5.4:4.6,NEAR.pn);
